<!DOCTYPE html>
<!--
Generated by phuker-music {{ version }}
https://github.com/Phuker/phuker-music
-->
<html lang="{{ lang }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta name="color-scheme" content="light dark">
    <meta name="google" content="notranslate">
    <link rel="icon" sizes="256x256" href="{{ read_static_file_as_data_url('images/album-256.png', 'image/png') }}">
    <link rel="manifest" href="{{ manifest_url }}">

    <title>{{ albums_title }}</title>
    <style type="text/css">
        :root {
            --body-background-image: url({{ read_static_file_as_data_url('images/background-light.svg', 'image/svg+xml') }});
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --body-background-image: url({{ read_static_file_as_data_url('images/background-dark.svg', 'image/svg+xml') }});
            }
        }

        {{ read_static_file_as_text('css/albums.css') | trim | indent(8) | safe }}
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>{{ albums_title }}</h1>
        </header>
        <main>
            <ul>
                {%- for player_path, title, cover_path in indexes %}
                <li>
                    <a href="{{ player_path }}">
                        <span class="cover-container">
                            <img src="{{ cover_path or read_static_file_as_data_url('images/album-256.png', 'image/png') }}" alt="Album cover of: {{ title }}">
                        </span>
                        <span class="title">{{ title }}</span>
                    </a>
                </li>
                {%- endfor %}
            </ul>
        </main>
    </div>
</body>

</html>
