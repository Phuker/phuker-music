<!DOCTYPE html>
<!--
Generated by phuker-music {{ version }}
https://github.com/Phuker/phuker-music
-->
<html lang="{{ lang }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta name="google" content="notranslate">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" sizes="256x256" href="{{ read_static_file_as_data_url('images/album-256.png', 'image/png') }}">
    <link rel="manifest" href="{{ manifest_url }}">

    <title>My Music Collections</title>
    <style type="text/css">
        :root {
            --body-background-image: url({{ read_static_file_as_data_url('images/background.svg', 'image/svg+xml') }});
        }

        {{ read_static_file_as_text('css/albums.css') | trim | indent(8) | safe }}
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>My Music Collections</h1>
        </header>
        <main>
            <ul>
                {%- for player_path, title, cover_path in indexes %}
                <li>
                    <a href="{{ player_path }}">
                        <span class="cover-container">
                            <img src="{{ cover_path or read_static_file_as_data_url('images/album-256.png', 'image/png') }}" alt="Album cover of: {{ title }}">
                        </span>
                        <span class="title">{{ title }}</span>
                    </a>
                </li>
                {%- endfor %}
            </ul>
        </main>
    </div>
</body>

</html>
