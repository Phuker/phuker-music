<!DOCTYPE html>
<!--
Generated by phuker-music {{ version }}
https://github.com/Phuker/phuker-music
-->
<html lang="{{ lang }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" href="{{ read_file_as_data_url('images/album-256.png', 'image/png') }}">

    <title>My Music Collections</title>
    <style type="text/css">
    {{ read_file('css/albums.css') | trim | indent(4) | safe }}
    </style>
</head>

<body>
<div class="container">
    <h1>My Music Collections</h1>
    <ul>
        {%- for player_path, title, cover_path in indexes %}
        <li>
            <a href="{{ player_path }}">
                <span class="cover-container">
                    <img src="{{ cover_path or read_file_as_data_url('images/album-256.png', 'image/png') }}" alt="Album cover image of: {{ title }}">
                </span>
                <span class="title">{{ title }}</span>
            </a>
        </li>
        {%- endfor %}
    </ul>
</div>
</body>

</html>
