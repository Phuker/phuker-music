<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Albums Manager</title>
    <link rel="stylesheet" href="./static/css/albums_webui.css">
    <script src="./static/libs/vue@3.5.38/vue.global.prod.js"></script>
    <script src="./static/libs/sortablejs@1.15.7/Sortable.min.js"></script>
    <script src="./static/libs/vuedraggable@4.1.0/vuedraggable.umd.min.js"></script>
</head>

<body>
    <div id="app">
        <div id="top-bar">
            <h1>Albums Manager</h1>
            <button id="btn-publish" type="submit" form="column-left" :disabled="scanStatus !== 'done' || isPublishing">Save &amp; Generate</button>
        </div>

        <div id="scan-progress" v-show="scanStatus !== 'done'" v-cloak aria-live="polite" role="status">
            <div>Scanning directories for audio and image files...</div>
            <div>Scanned {{ scannedDirs }} directories</div>
        </div>

        <div id="main-content" v-show="scanStatus === 'done'" v-cloak aria-live="polite">
            <div id="columns">
                <form id="column-left" @submit.prevent="actionPublish">
                    <div class="column-header">
                        <h2>Albums config</h2>
                    </div>
                    <div id="config-info">
                        <p>Albums directory: <span>{{ albumsDirPath }}</span></p>
                        <label>
                            Index filename:
                            <input type="text" v-model="albumsIndexFilename" placeholder="e.g. index.html" required>
                        </label>
                        <label>
                            Title:
                            <input type="text" v-model="albumsTitle" placeholder="e.g. Music" required>
                        </label>
                    </div>
                    <div class="column-header">
                        <h2>Albums</h2>
                    </div>
                    <div id="albums-list">
                        <draggable v-model="albums" group="albums" item-key="album_dir_path"
                            :animation="150"
                            ghost-class="sortable-ghost"
                            handle=".drag-handle"
                            @change="onAlbumsChange">
                            <template #item="{ element }">
                                <div class="album-card">
                                    <div class="card-row">
                                        <img class="drag-handle" src="./static/images/draggable.png" alt="Drag to reorder" title="Drag to reorder">
                                        <span class="card-label">Path:</span>
                                        <span class="card-path">{{ element.album_dir_path }}</span>
                                        <button class="btn-delete" @click="actionDeleteAlbum(element)" aria-label="Delete">&times;</button>
                                    </div>
                                    <div class="card-row">
                                        <label>Title:</label>
                                        <input type="text" class="card-title" v-model="element.title" placeholder="Default: directory name">
                                    </div>
                                    <div class="card-row">
                                        <label>Cover:</label>
                                        <select class="card-cover" v-model="element.cover_file">
                                            <option v-for="opt in getCoverOptions(element.album_dir_path, element.cover_file)" :key="opt.label" :value="opt.value">{{ opt.label }}</option>
                                        </select>
                                    </div>
                                    <div class="card-row">
                                        <label>Player filename:</label>
                                        <input type="text" class="card-output" v-model="element.player_filename" placeholder="Default: player.html">
                                    </div>
                                    <div class="card-row">
                                        <label><input type="checkbox" class="card-recursively" v-model="element.recursively"> Recursively</label>
                                    </div>
                                    <div class="card-row">
                                        <label>Sort:</label>
                                        <select class="card-sort" v-model="element.sort_type">
                                            <option value="filename">filename</option>
                                            <option value="mtime_desc">mtime_desc</option>
                                        </select>
                                    </div>
                                </div>
                            </template>
                        </draggable>
                    </div>
                </form>
                <div id="column-right">
                    <div class="column-header">
                        <h2>Available</h2>
                        <button id="btn-add-all" @click="actionAddAllAlbums">Add All</button>
                    </div>
                    <div id="available-list">
                        <draggable v-model="availableItems"
                            :group="{ name: 'albums', pull: 'clone', put: false }"
                            :sort="false"
                            item-key="album_dir_path"
                            ghost-class="sortable-ghost"
                            handle=".drag-handle"
                            :animation="150">
                            <template #item="{ element }">
                                <div class="available-item">
                                    <img class="drag-handle" src="./static/images/draggable.png" alt="Drag" title="Drag">
                                    {{ element.album_dir_path }}
                                </div>
                            </template>
                        </draggable>
                    </div>
                </div>
            </div>
        </div>

        <div id="toast-container" aria-live="polite">
            <div v-for="toast in toasts" :key="toast.id" class="toast-item" :class="toast.type">{{ toast.text }}</div>
        </div>
    </div>

    <script src="./static/js/albums_webui.js"></script>
</body>

</html>
