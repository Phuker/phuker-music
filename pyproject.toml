[project]
name = "phuker-music"
dynamic = ["version"]
description = "Offline single-file HTML music player generator"
readme = "Readme.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Phuker", email = "Phuker@users.noreply.github.com" },
]
dependencies = [
    "jinja2",
    "langid",
    "mutagen",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Source = "https://github.com/Phuker/phuker-music"

[project.scripts]
phuker-music = "phuker_music.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "phuker_music.__version__" }

[tool.setuptools.packages.find]
include = ["phuker_music*"]

[tool.setuptools.package-data]
phuker_music = ["templates/**"]
