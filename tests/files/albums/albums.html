            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        ul {
            flex: 1;
            min-height: 0;
            overflow: auto;
            scrollbar-width: none;
            font-family: Consolas, Monaco, "Droid Sans Mono", "Courier New", "Microsoft YaHei", "PingFang SC", "WenQuanYi Micro Hei", monospace;
        }

        ul::-webkit-scrollbar {
            display: none;
        }

        ul, li {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin: 4px 0;
        }

        li a {
            box-sizing: border-box;
            color: var(--text-color-primary);
            text-decoration: none;
            padding: 8px;
            display: block;

            border-style: solid;
            border-width: var(--item-border-width);
            border-color: var(--item-border-color);
            border-radius: 8px;
            background-color: var(--item-background-color);
        }

        li a span.cover-container {
            display: inline-block;
            width: 3em;
            height: 3em;
            vertical-align: middle;
        }

        li a span.cover-container img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 2px;
        }

        li a span.title {
            display: inline-block;
            width: calc(100% - 4em);
            vertical-align: middle;
            overflow-wrap: break-word;
        }

        @media (max-width: 767px) {
            .container {
                margin: 0 10px;
            }
        }
    </style>
</head>
